name: CI

on:
  # Only the default branch on push. Branch work is covered by `pull_request`,
  # and listening to both would run every job twice on the same commit for any
  # branch that has a PR open.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this same matrix before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test would otherwise hold the runner for six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >=22. 24 is also the version
        # release.yml publishes with.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

  # The unit tests need no browser. This runs the example for real: the
  # scenarios in a browser, the screenshots, the recording and the handoff
  # files, which is the path a Playwright update could break.
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Install the browser, and ffmpeg to join the videos
        run: |
          npx playwright install --with-deps chromium
          command -v ffmpeg > /dev/null || { sudo apt-get update && sudo apt-get install -y ffmpeg; }

      - name: Check this computer has what a run needs
        run: node bin/specsheet.mjs doctor

      - name: Run the example
        run: npm run example

      - name: Check what the run produced
        run: |
          set -euo pipefail
          out=examples/contact-form/handoff/HELP-12/out
          for file in handoff.html flow.png checklist.md comment.md manifest.json \
            features/contact-form.feature videos/contact-form.desktop.mp4; do
            if [ ! -s "$out/$file" ]; then
              echo "::error::the example did not produce $file"
              exit 1
            fi
          done
          grep -q 'Background:' "$out/features/contact-form.feature"

  # People who already installed the plugin get a change to the skill only
  # when the version changes: Claude Code treats the same version as up to
  # date. So a pull request that changes the skill has to raise the version.
  plugin-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the comparison needs the base branch
          persist-credentials: false

      - name: Check the version rose if the skill changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="refs/remotes/origin/$BASE_REF"
          if git diff --quiet "$base...HEAD" -- skills .claude-plugin; then
            echo "The skill and the plugin files are unchanged."
            exit 0
          fi
          before="$(git show "$base:.claude-plugin/plugin.json" | jq -r .version)"
          after="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$before" = "$after" ]; then
            echo "::error::skills/ or .claude-plugin/ changed, but the version is still $after. Raise it in package.json, package-lock.json and .claude-plugin/plugin.json (CONTRIBUTING.md, Releasing, step 1), or the change will not reach people who already installed the plugin."
            exit 1
          fi
          echo "The skill changed, and the version went from $before to $after."
