name: CI

on:
  # Only the default branch on push. Branch work is covered by `pull_request`,
  # and listening to both would run every job twice on the same commit for any
  # branch that has a PR open.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this same matrix before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test would otherwise hold the runner for six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >=22. 24 is also the version
        # release.yml publishes with.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test
